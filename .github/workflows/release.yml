name: CI & Multi-OS Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend-go/go.sum
      - name: Check & build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npm run build
      - name: Run Go tests (gateway & cockpit)
        run: |
          (cd backend-go && go test -count=1 ./...)
          (cd packages/cockpit && go test -count=1 ./...)
      - name: Verify cross-platform Go builds (Windows / Linux / macOS)
        run: |
          (cd backend-go && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/agy-gateway)
          (cd backend-go && GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/agy-gateway)
          (cd backend-go && GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/agy-gateway)
          (cd packages/cockpit && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/agy-cockpit)
          (cd packages/cockpit && GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/agy-cockpit)

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend-go/go.sum
      - name: Build multi-OS release binaries and bundles
        run: bash scripts/build-releases.sh
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-releases/*
          generate_release_notes: true
      - name: Upload workflow artifacts (manual dispatch)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: agy-mobile-gateway-releases
          path: dist-releases/*
