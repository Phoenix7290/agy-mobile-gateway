<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="neon-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#27272a" stroke-width="4" />
  
  <!-- Outer Orbit Rings -->
  <ellipse cx="256" cy="256" rx="180" ry="80" fill="none" stroke="#6366f1" stroke-width="6" stroke-dasharray="12 16" transform="rotate(-30 256 256)" opacity="0.6" />
  <ellipse cx="256" cy="256" rx="180" ry="80" fill="none" stroke="#ec4899" stroke-width="6" stroke-dasharray="12 16" transform="rotate(30 256 256)" opacity="0.6" />
  
  <!-- Central Glowing AGY Monogram -->
  <g filter="url(#neon-blur)">
    <!-- Stylized Chevron / A Shape -->
    <path d="M 256 120 L 370 360 L 310 360 L 256 240 L 202 360 L 142 360 Z" fill="url(#glow-grad)" />
    <!-- Core Crossbar Dot -->
    <circle cx="256" cy="300" r="18" fill="#ffffff" />
  </g>
</svg>
