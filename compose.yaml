services:
  agy-gateway:
    build: .
    container_name: agy-gateway
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./app:/app
      - ./ssh:/root/.ssh:ro
      - ./data:/data
    environment:
      - TARGET_HOST=${TARGET_HOST:-192.168.1.190}
      - TARGET_USER=${TARGET_USER:-ai}
      - WOL_MAC=${WOL_MAC:-bc:fc:e7:ca:84:05}
      - SSH_KEY=${SSH_KEY:-/root/.ssh/id_ed25519}
      - PORT=${PORT:-8088}

  agy-ttyd:
    build:
      context: .
      dockerfile: Dockerfile.ttyd
    image: agy-ttyd:custom
    container_name: agy-ttyd
    restart: unless-stopped
    network_mode: host
    command: ["ttyd", "-p", "7681", "-b", "/terminal", "-W", "-t", "fontSize=14", "ssh", "-o", "StrictHostKeyChecking=accept-new", "ryanslx@192.168.1.190"]
