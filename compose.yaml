services:
  agy-gateway:
    build: .
    container_name: agy-gateway
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./ssh:/root/.ssh:ro
      - ./data:/data
    environment:
      - GATEWAY_MODE=${GATEWAY_MODE:-gateway}
      - DATA_DIR=${DATA_DIR:-/data}
      - TARGET_HOST=${TARGET_HOST:-192.168.1.190}
      - TARGET_USER=${TARGET_USER:-ai}
      - WOL_MAC=${WOL_MAC:-bc:fc:e7:ca:84:05}
      - SSH_KEY=${SSH_KEY:-/root/.ssh/id_ed25519}
      - PORT=${PORT:-8088}
      - ENABLE_TELEMETRY=${ENABLE_TELEMETRY:-true}
      - ENABLE_TERMINAL=${ENABLE_TERMINAL:-true}
      - ENABLE_WATCHDOG=${ENABLE_WATCHDOG:-true}
      - ENABLE_WOL=${ENABLE_WOL:-true}
      - WHISPER_URL=${WHISPER_URL:-}
      - ENABLE_WHISPER=${ENABLE_WHISPER:-false}

  agy-ttyd:
    build:
      context: .
      dockerfile: Dockerfile.ttyd
    image: agy-ttyd:custom
    container_name: agy-ttyd
    restart: unless-stopped
    network_mode: host
    command: ["ttyd", "-p", "7681", "-b", "/terminal", "-W", "-t", "fontSize=14", "ssh", "-t", "-o", "StrictHostKeyChecking=accept-new", "ryanslx@192.168.1.190", "exec fish -l -C 'function fish_greeting; end'"]
